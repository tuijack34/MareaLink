# Publica un APK listo para instalar cada vez que cambia la versión (versionName en app/build.gradle.kts).
# También se puede correr a mano desde la pestaña Actions → Release → Run workflow.
# El APK sale SIN Client ID: la app lo pide la primera vez que se abre.
name: Release

on:
  push:
    branches: [main]
    paths: ['app/build.gradle.kts']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed 's/^link-//')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "La v$v ya está publicada, no hago nada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Clave de firma (secretos del repo)
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Ver README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "signing.storeFile=release.jks"
            echo "signing.storePassword=$STORE_PASSWORD"
            echo "signing.keyAlias=$KEY_ALIAS"
            echo "signing.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Compilar
        if: steps.ver.outputs.skip != 'true'
        env:
          MAREA_PUBLIC: '1'
        run: |
          chmod +x gradlew
          # Maven Central a veces corta con "429 Too Many Requests": reintentamos
          ./gradlew assembleRelease --no-daemon || (sleep 60 && ./gradlew assembleRelease --no-daemon) || (sleep 120 && ./gradlew assembleRelease --no-daemon)
          mv app/build/outputs/apk/release/app-release.apk "MareaLink-${{ steps.ver.outputs.tag }}.apk"

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Compilar Marea PC (Windows)
        if: steps.ver.outputs.skip != 'true'
        run: |
          dotnet publish pc/MareaPC/MareaPC.csproj -c Release -o pcout
          mv pcout/MareaPC.exe MareaPC.exe

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Marea Link ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            MareaLink-*.apk
            MareaPC.exe
          generate_release_notes: true
